tracking_uri: http://127.0.0.1:5000
container_tracking_uri: http://host.docker.internal:5000
database_url: postgresql+pg8000://mlops:mlops@127.0.0.1:5432/platform
store_dir: store
profiles_file: configs/hardware_profiles.yaml
runs_dir: runs
default_profile: pc-cpu
prometheus_url: http://127.0.0.1:9090
prometheus_targets_dir: prometheus/targets
prometheus_target_host: host.docker.internal
dataset_ignore: ["*.cache", ".DS_Store", "Thumbs.db", "__MACOSX", "__pycache__", ".ipynb_checkpoints"]
# Physical cores of the Docker machine reserved per kind of container. A limited profile gets one thread
# on each of its cores and the sibling thread stays idle, so measures don't depend on what else runs.
# Remove this block to let Docker place containers freely.
cpu_pinning:
  threads_per_core: 2   # logical CPUs per physical core, siblings numbered next to each other
  services: [0, 1, 2, 3]
  jobs: [4, 5, 6, 7]
