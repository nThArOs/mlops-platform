services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: platform
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d platform"]
      interval: 5s
      retries: 10

  mlflow:
    build: docker/mlflow
    image: mlops-platform-mlflow:cpu
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  api:
    build:
      context: .
      dockerfile: docker/platform/Dockerfile
    image: mlops-platform:cpu
    ports:
      - "127.0.0.1:8000:8000"
    volumes: &platform
      - ./configs:/platform/configs:ro
      - ./store:/platform/store
      - ./runs:/platform/runs
      - ./prometheus/targets:/platform/prometheus/targets
      # folder holding the projects, so their project.yaml and code can be read and mounted
      - ${MLOPS_PROJECTS_DIR:-..}:/projects
      # the platform starts training and serving containers on the host's Docker
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts: &hosts
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on: &deps
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  worker:
    image: mlops-platform:cpu
    command: ["mlops", "worker"]
    volumes: *platform
    extra_hosts: *hosts
    restart: unless-stopped
    depends_on: *deps

volumes:
  postgres:
  mlartifacts:
  prometheus:
