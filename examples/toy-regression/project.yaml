name: toy-regression
image: mlops-toy-regression:cpu
task: regression

datasets:
  - name: toy
    mount: data/toy

entrypoints:
  train:
    command: python train.py --config {config} --data {dataset_path}
    config: configs/train.yaml
    outputs: { model: models/model.json, metrics: results/train.json }
  evaluate:
    command: python evaluate.py --model {model} --data {dataset_path}
    outputs: { metrics: results/eval.json }

metrics:
  primary: rmse
  higher_is_better: false
  watch: [rmse, r2]
