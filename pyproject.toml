[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-platform"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "mlflow-skinny>=3.4,<4",
    "sqlalchemy>=2.0",
    "pg8000>=1.31",
]

[project.scripts]
mlops = "mlops.cli:main"

[tool.setuptools.packages.find]
include = ["mlops*"]
